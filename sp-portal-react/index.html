<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Provider Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Plus Jakarta Sans é a família real da app (modern-ui.css redefine
         --font-sans). Estava a ser pedida por @import dentro de modern-ui.css,
         o que só é descoberto depois do CSS ser lido e transferido — daí o
         flash de tipo de letra a cada carregamento. Pedida aqui, arranca com
         o documento. Eixo variável para pesos consistentes em toda a escala. -->
    <!-- Source Serif 4 titula o acabamento "paper & ink"; IBM Plex Mono é a
         família que os tokens já pediam para valores numéricos sem que
         ninguém a carregasse (as tabelas caíam no mono do sistema). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="has-beam-sidebar sp-portal">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
